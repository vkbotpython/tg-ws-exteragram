name: build plugin

# Manual build: Actions -> "build plugin" -> Run workflow.
# Produces a single self-contained .plugin file for exteraGram / AyuGram.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the archive (letters, digits, ., -, _)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: pip install PyYAML

      - name: Verify source package
        run: python -c "from scripts.build_elyx import verify; verify()"

      - name: Prepare version label
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version || '' }}"
          v="${v//[^A-Za-z0-9._-]/_}"
          if [ -z "$v" ]; then v="manual-${{ github.run_number }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Archive version: $v"

      - name: Build single-file .plugin
        run: python scripts/build_plugin.py "builds/tg_ws_bridge-${{ steps.ver.outputs.value }}.plugin"

      - name: Check plugin structure
        shell: bash
        run: |
          python - <<'PY'
          import ast, glob
          path = glob.glob('builds/*.plugin')[0]
          with open(path, encoding='utf-8') as fh:
              tree = ast.parse(fh.read(), filename=path)
          def literal(node):
              if isinstance(node, ast.Constant):
                  return node.value
              if isinstance(node, (ast.List, ast.Tuple)):
                  return [literal(item) for item in node.elts]
              return None

          constants = {
              node.targets[0].id: literal(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign) and isinstance(node.targets[0], ast.Name)
          }
          for key in ('__id__', '__name__', '__version__', '__sdk_version__', '__requirements__'):
              assert key in constants, 'missing metadata: ' + key
          classes = [
              node for node in tree.body
              if isinstance(node, ast.ClassDef)
              and any(isinstance(b, ast.Name) and b.id == 'BasePlugin' for b in node.bases)
          ]
          assert any(c.name == 'TgWsBridgePlugin' for c in classes), 'plugin class not found'
          print('Plugin OK:', path)
          print('Metadata:', constants['__id__'], constants['__version__'])
          PY

      - name: Upload installable plugin
        uses: actions/upload-artifact@v7
        with:
          name: tg_ws_bridge-${{ steps.ver.outputs.value }}.plugin
          path: builds/*.plugin
          if-no-files-found: error
          retention-days: 90
