name: build plugin

# Manual build: Actions -> "build plugin" -> Run workflow.
# Produces a ready-to-install .elyx artifact for exteraGram / AyuGram.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the archive (letters, digits, ., -, _)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: pip install PyYAML

      - name: Verify package
        run: python -c "from scripts.build_elyx import verify; verify()"

      - name: Prepare version label
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.version || '' }}"
          v="${v//[^A-Za-z0-9._-]/_}"
          if [ -z "$v" ]; then v="manual-${{ github.run_number }}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
          echo "Archive version: $v"

      - name: Build .elyx
        run: python scripts/build_elyx.py "builds/tg_ws_bridge-${{ steps.ver.outputs.value }}.elyx"

      - name: Check archive contents
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          path = glob.glob('builds/*.elyx')[0]
          with zipfile.ZipFile(path) as zf:
              names = zf.namelist()
          for required in ('refmap.yml', 'main.py', 'LICENSE', 'NOTICE.md', 'assets/cacert.pem'):
              assert required in names, 'missing in archive: ' + required
          print('Archive OK:', path)
          print('Files:', len(names), '| Wheels:', len([n for n in names if n.startswith('wheels/')]))
          PY

      - name: Upload installable artifact
        uses: actions/upload-artifact@v7
        with:
          name: tg_ws_bridge-${{ steps.ver.outputs.value }}.elyx
          path: builds/*.elyx
          if-no-files-found: error
          retention-days: 90
