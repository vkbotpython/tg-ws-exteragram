name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify package
        run: python -c "from scripts.build_elyx import verify; verify()"
      - name: Build .elyx
        run: python scripts/build_elyx.py "builds/tg_ws_bridge-${{ github.ref_name }}.elyx"
      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: builds/*.elyx
          generate_release_notes: true
