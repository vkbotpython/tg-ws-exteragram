name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install build dependencies
        run: pip install PyYAML
      - name: Verify package
        run: python -c "from scripts.build_elyx import verify; verify()"
      - name: Build .elyx
        run: python scripts/build_elyx.py "builds/tg_ws_bridge-${{ github.ref_name }}.elyx"
      - name: Publish release asset
        uses: softprops/action-gh-release@v3
        with:
          files: builds/*.elyx
          generate_release_notes: true
